# One origin for everything: the admin console, the public /c/<code> pages, and the API
# the phones talk to. Keeps the session cookie same-origin and leaves one port to expose.

upstream cf_admin { server admin:3000; }
upstream cf_api   { server api:4000;   }

server {
    listen 80;
    server_name _;

    # Card photos are a few MB each; the API caps the real limit.
    client_max_body_size 20m;
    client_body_timeout 120s;

    # OCR on a slow CPU can take 20-30 s for a dense card.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # The Android app posts straight to the API, bypassing Next — no cookie involved, and
    # no reason to stream a 10 MB upload through a second Node process.
    location /api/v1/app/   { proxy_pass http://cf_api; }
    location /api/v1/leads  { proxy_pass http://cf_api; }
    location /api/v1/leads/ { proxy_pass http://cf_api; }

    # Everything else — admin UI, /c/<code>, and the proxied admin API calls.
    location / { proxy_pass http://cf_admin; }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
